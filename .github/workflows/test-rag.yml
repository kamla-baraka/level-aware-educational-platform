
name: Test RAG Retrieval

on:
  workflow_dispatch:

jobs:
  test-rag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RAG context test
        run: python test_rag_context.py

     
      - name: Run RAG quality evaluation
        run: python test_retrieval_quality.py

      - name: Compare retrieval methods
        run: python compare_retrieval_methods.py

      - name: Test generation context coverage
        run: python test_context_coverage.py

      - name: Compare generation context Top-K
        run: python compare_context_topk.py




